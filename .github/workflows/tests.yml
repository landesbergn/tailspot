name: tests

on:
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN: without this block the token defaults to
# the repo-wide setting (write on many scopes), which is more than a checkout
# + xcodebuild needs. Add scopes here only when a step actually requires them.
permissions:
  contents: read

# Newer pushes to the same PR cancel in-flight runs.
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Three jobs, one required check. Branch protection requires the "Unit tests"
# check — that name now belongs to the cheap gate job at the bottom, which
# fails closed unless change detection succeeded AND the iOS job either
# passed or was legitimately skipped. The expensive macOS job only runs when
# the diff could actually affect the app, so backend-/web-/docs-only PRs get
# a green required check in ~30s instead of a 10-minute simulator run.
jobs:
  # Classifies the PR diff. `ios` is true unless EVERY changed file lives in a
  # path the iOS build provably never touches. Deny-list, not allow-list: any
  # new top-level directory defaults to running the full suite, so the
  # conservative failure mode is "ran tests unnecessarily", never "skipped
  # tests that mattered".
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the PR base commit is present for merge-base.
          # This repo is small; the extra fetch costs a couple of seconds.
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        run: |
          # On pull_request events HEAD is the synthetic merge commit, so
          # merge-base(base, HEAD) is the base-branch tip and the diff below
          # is exactly "what this PR changes" — base-branch drift excluded.
          merge_base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          changed=$(git diff --name-only "$merge_base" HEAD)
          printf 'Changed files:\n%s\n' "$changed"

          # Paths that the iOS app/test build cannot observe:
          #   backend/  — Node service, has its own workflow
          #   web/      — the tailspot.app marketing site
          #   design/   — HTML/JSX reference prototype, never compiled
          #   tools/    — host-side scripts (deploy config, eval harnesses)
          #   bin/      — dev shell scripts (deploy, log tailing, doc hook)
          #   *.md      — documentation anywhere in the tree
          # Everything else (ios/, .github/, project files, anything new)
          # counts as iOS-relevant.
          ios=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              backend/*|web/*|design/*|tools/*|bin/*|*.md) ;;
              *) ios=true ;;
            esac
          done <<< "$changed"

          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "iOS-relevant: $ios"

  ios-tests:
    name: iOS simulator tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # macos-26 explicitly, NOT macos-latest: the -latest alias serves a mixed
    # pool (macos-15-arm64 vs macos-26-arm64 within one day, seen 2026-07-11
    # and again 2026-07-12), and only the macos-26 image carries the Xcode
    # pinned below — on a macos-15 runner the pin fails the job before any
    # test runs. Image and Xcode must be bumped together.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # PINNED, not latest-stable: even within one image, 'latest-stable'
      # resolved to different Xcodes on different runs — and the older
      # compiler type-checked differently than local dev. Pin to the version
      # Noah builds with locally; bump deliberately alongside local Xcode
      # upgrades. If the runner image lacks this version the job fails
      # loudly here (better than silent drift) — bump or wait for the image.
      - name: Select Xcode (pinned to local dev version)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # Cold simulator boot on a fresh runner was the single biggest cost in
      # this job: ~4 min of dead time between "build finished" and "Testing
      # started". Kick the boot off in the background NOW so it overlaps the
      # ~2.5 min of package resolution + compilation below. Runs after the
      # Xcode pin so the boot uses the same CoreSimulator runtime xcodebuild
      # will test against. nohup + redirect so the step returns immediately
      # instead of waiting out the boot; `|| true` because a boot race with
      # xcodebuild is harmless (booting an already-booting device is a no-op
      # error).
      - name: Pre-boot simulator (overlaps boot with build)
        run: nohup xcrun simctl boot 'iPhone 17' >/dev/null 2>&1 || true

      # Prints the toolchain + the simulators this runner image actually
      # has, so if 'iPhone 17' is absent the log tells us what to switch to.
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone || true

      # -parallel-testing-enabled NO: by default xcodebuild boots a fresh
      # *clone* of the simulator for testing, which ignores the device we
      # pre-booted above and pays the cold-boot cost again on the critical
      # path. The suite ran on a single clone anyway (no cross-process
      # parallelism to lose), and Swift Testing still runs individual tests
      # concurrently in-process, so this trades nothing for the boot overlap.
      - name: Run TailspotTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Tailspot/Tailspot.xcodeproj \
            -scheme Tailspot \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:TailspotTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

  # The required check. Branch protection points at "Unit tests", and a
  # workflow-level paths: filter would leave that check stuck in "Expected"
  # on skipped PRs — so instead this always-running gate owns the name.
  # Fail-closed: anything other than (detection succeeded + tests passed or
  # were skipped-by-detection) fails the check, including cancelled or
  # errored upstream jobs.
  test:
    name: Unit tests
    needs: [changes, ios-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          echo "changes:   ${{ needs.changes.result }}"
          echo "ios-tests: ${{ needs.ios-tests.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection did not succeed — failing closed."
            exit 1
          fi
          case "${{ needs.ios-tests.result }}" in
            success)
              echo "iOS tests passed." ;;
            skipped)
              echo "Diff cannot affect the iOS app — tests not required." ;;
            *)
              echo "iOS tests did not pass — failing."
              exit 1 ;;
          esac
