name: tests

on:
  pull_request:
    branches: [main]
  # The backstop for the web-only skip below: every merge to main runs the
  # full suite, whatever it touched.
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN: without this block the token defaults to
# the repo-wide setting (write on many scopes), which is more than a checkout
# + xcodebuild needs. Add scopes here only when a step actually requires them.
permissions:
  contents: read

# Newer pushes to the same PR cancel in-flight runs. Each push to main gets
# its own group (keyed by commit), because GitHub cancels a PENDING run in a
# shared group whenever a newer one queues, even with cancel-in-progress off.
# So every merge gets its own result, and a red main names the commit.
concurrency:
  group: tests-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The iOS suite is skipped on a PR whose every changed file is under web/ or
# is a top-level Markdown doc (CHANGELOG, PLAN, README...). Noah asked for
# this on 2026-11-26 to speed up website PRs.
#
# History: a path-gated skip shipped 2026-08-15 and was reverted the same day,
# because its failure mode was silent: a classifier bug would give a green
# required check with zero tests run. This version answers that three ways:
#   1. The rule is an allowlist that fails toward running. Anything outside
#      web/ and top-level *.md, an empty file list, or a git error runs the
#      full suite.
#   2. A skip is loud: the job summary and a notice say the iOS suite was
#      skipped and list the files that allowed it.
#   3. The backstop: every push to main runs the full suite (the push
#      trigger above). If a skip ever hid a break, main goes red on the next
#      merge and GitHub emails whoever merged.
# The required check keeps its name ("Unit tests") and always reports.
jobs:
  test:
    name: Unit tests
    # macos-26 explicitly, NOT macos-latest: the -latest alias serves a mixed
    # pool (macos-15-arm64 vs macos-26-arm64 within one day, seen 2026-07-11
    # and again 2026-07-12), and only the macos-26 image carries the Xcode
    # pinned below — on a macos-15 runner the pin fails the job before any
    # test runs. Image and Xcode must be bumped together.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scope step can diff the PR against its base.
          fetch-depth: 0

      # Decides whether this run needs the iOS suite. See the comment at the
      # top of the file. Defaults to running it; only a PR whose changed
      # files are ALL under web/ or top-level *.md skips.
      - name: Decide whether the iOS suite runs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          ios=true
          if [ "$EVENT" = "pull_request" ]; then
            # --no-renames: a file moved from ios/ to web/ must list its old
            # path too, or the move would look web-only.
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD"); then
              # Files outside the allowlist. `|| true` because grep exits 1
              # when it prints nothing, which is the skip case.
              outside=$(printf '%s\n' "$files" | grep -v -E '^web/|^[^/]+\.md$' || true)
              if [ -n "$files" ] && [ -z "$outside" ]; then
                ios=false
              fi
            else
              echo "::warning::Could not list the changed files; running the full suite."
            fi
          fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          if [ "$ios" = false ]; then
            echo "::notice title=iOS suite skipped::Every changed file is under web/ or a top-level Markdown doc. The full suite runs again when this merges to main."
            {
              echo "## iOS suite skipped"
              echo
              echo "Every changed file is under \`web/\` or is a top-level Markdown doc, so the simulator tests did not run. The full suite runs on the merge to \`main\`."
              echo
              echo "Changed files:"
              echo
              printf '%s\n' "$files" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Running the full iOS suite ($EVENT)."
          fi

      # Seconds, and stdlib-only: checks that tools/generate-aircraft-types.py
      # and the bundled AircraftTypes.json agree (tiers, types, override
      # targets). Lives in this every-PR job, not the path-gated backend job,
      # so a catalog edit can never skip it.
      - name: Aircraft catalog tests (Python)
        run: python3 -m unittest discover -s tools -p 'test_aircraft_tiers.py' -v

      # PINNED, not latest-stable: even within one image, 'latest-stable'
      # resolved to different Xcodes on different runs — and the older
      # compiler type-checked differently than local dev. Pin to the version
      # Noah builds with locally; bump deliberately alongside local Xcode
      # upgrades. If the runner image lacks this version the job fails
      # loudly here (better than silent drift) — bump or wait for the image.
      - name: Select Xcode (pinned to local dev version)
        if: steps.scope.outputs.ios == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # Cold simulator boot on a fresh runner was the single biggest cost in
      # this job: ~4 min of dead time between "build finished" and "Testing
      # started". Kick the boot off in the background NOW so it overlaps the
      # ~2.5 min of package resolution + compilation below. Runs after the
      # Xcode pin so the boot uses the same CoreSimulator runtime xcodebuild
      # will test against. nohup + redirect so the step returns immediately
      # instead of waiting out the boot; `|| true` because a boot race with
      # xcodebuild is harmless (booting an already-booting device is a no-op
      # error).
      - name: Pre-boot simulator (overlaps boot with build)
        if: steps.scope.outputs.ios == 'true'
        run: nohup xcrun simctl boot 'iPhone 17' >/dev/null 2>&1 || true

      # Prints the toolchain + the simulators this runner image actually
      # has, so if 'iPhone 17' is absent the log tells us what to switch to.
      - name: Show toolchain
        if: steps.scope.outputs.ios == 'true'
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone || true

      # -parallel-testing-enabled NO: by default xcodebuild boots a fresh
      # *clone* of the simulator for testing, which ignores the device we
      # pre-booted above and pays the cold-boot cost again on the critical
      # path. The suite ran on a single clone anyway (no cross-process
      # parallelism to lose; verified 2026-08-15: identical 914 tests / 119
      # suites either way). It DOES cost in-process parallelism: with this
      # flag Swift Testing runs the tests one at a time (2026-10-31: run
      # 41085490141's per-test durations sum to 266 s of its 297 s run).
      # Locally that parallelism saves about a quarter of the run (most
      # suites are @MainActor and share one thread), still less than a cold
      # clone boot on a fresh runner, so the flag stays. It does mean every
      # fixed sleep in a test is wall time here.
      - name: Run TailspotTests
        if: steps.scope.outputs.ios == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Tailspot/Tailspot.xcodeproj \
            -scheme Tailspot \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:TailspotTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
