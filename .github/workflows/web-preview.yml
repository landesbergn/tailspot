name: Web preview

# Spins up a throwaway copy of tailspot.app for any PR that touches web/, so
# the site can be reviewed on a real phone before it reaches production.
# Fly destroys the app automatically when the PR closes.
#
# Requires a FLY_API_TOKEN repo secret. Create one scoped to the www app only
# — a full-account token in CI is a much bigger blast radius than this needs:
#
#   fly tokens create deploy -a tailspot-www | gh secret set FLY_API_TOKEN
#
# (piping straight into gh keeps the token out of your shell history and
# scrollback; this repo has had two credential leaks already)

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    # Only web changes get a preview. This is a convenience deploy, not a
    # correctness gate, so skipping it elsewhere costs nothing — unlike the
    # unit-test path gating that got reverted in #191.
    paths:
      - 'web/**'
      - '.github/workflows/web-preview.yml'

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    concurrency:
      group: web-preview-pr-${{ github.event.number }}
      cancel-in-progress: true
    environment:
      name: web-preview-pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      # Fail with an explanation rather than a wall of flyctl auth errors.
      - name: Check the deploy token is configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set — see the comment at the top of .github/workflows/web-preview.yml for the one-liner that creates it."
            exit 1
          fi

      - name: Deploy preview
        id: deploy
        uses: superfly/fly-pr-review-apps@1.5.0
        with:
          # The PR number in the name is what keeps previews from colliding
          # with each other, and from ever resolving to tailspot-www.
          name: tailspot-www-pr-${{ github.event.number }}
          path: web
          config: fly.preview.toml
          region: sjc
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Comment the preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) return;
            const marker = '<!-- web-preview -->';
            const body = `${marker}\n**Preview:** ${url}\n\n` +
              `A throwaway copy of the site from this branch. Open it on a phone — ` +
              `the layout bugs on this page have all been mobile-only. ` +
              `Destroyed automatically when the PR closes.`;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(
              github.rest.issues.listComments, {owner, repo, issue_number});
            const mine = existing.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment(
                {owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment(
                {owner, repo, issue_number, body});
            }
