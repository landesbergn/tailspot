# User agents of the bots that fetch a link to draw its preview card.
# iMessage identifies itself as "facebookexternalhit/1.1 Facebot
# Twitterbot/1.0" (inside a Safari UA string), so the Facebook and Twitter
# tokens cover it. Used by the /c/CODE invite route below.
map $http_user_agent $link_preview_bot {
    default 0;
    "~*(facebookexternalhit|facebot|twitterbot|whatsapp|slackbot|discordbot|telegrambot|linkedinbot|skypeuripreview|redditbot|embedly|pinterest)" 1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript text/plain;
    gzip_min_length 256;

    # CSS/JS have stable filenames and change on deploy — revalidate every time
    # (ETag → 304 when unchanged) so updates land immediately, never stale.
    # ("immutable" is only safe for content-hashed names, which we don't use.)
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Images & fonts — short cache, not "immutable" (filenames are stable too).
    location ~* \.(ico|png|jpg|jpeg|svg|woff2?)$ {
        expires 1d;
    }

    # HTML pages — revalidate each time
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Universal links (challenge invites) ---------------------------------
    #
    # iOS fetches this file (through Apple's CDN) and uses it to decide
    # that https://tailspot.app/c/CODE belongs to the app. It must be
    # served over https from this exact path, with NO redirect (not even
    # www -> apex), as JSON, unsigned. The file has no extension, so
    # nginx would otherwise label it application/octet-stream.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # An invite link opened where the app can't take it — desktop,
    # Android, an iPhone without Tailspot — lands here and goes straight
    # to the App Store. No landing page. When the app IS installed iOS
    # opens it directly and this server never sees the request.
    # The code alphabet exactly: 6 characters (8 for codes issued before
    # 2026-09-26, which stay valid) from A-Z minus I, L and O,
    # plus 2-9 (InviteCode.alphabet — 0, 1, I, L and O are excluded because
    # they're ambiguous in print). Anything else under /c/ falls through to
    # `location /` and its 404, which is what the docs promise: a code that
    # could never exist gets the 404, not a pointless App Store trip.
    # Quoted: nginx reads an unquoted `{6}` / `{8}` as a config block and refuses
    # to start ("unknown directive"). Keep the quotes.
    #
    # Link-preview fetchers are the exception: they get invite.html, whose
    # Open Graph tags describe a challenge invite. Without this, a pasted
    # invite previewed as the App Store listing the 302 leads to. The app's
    # share sheet hands Messages its own preview card, but that card is
    # lost on Copy + paste, and WhatsApp/Slack/Discord always fetch the link
    # themselves. `rewrite ... last` inside `if` is one of the safe uses.
    location ~* "^/c/([a-hj-km-np-z2-9]{6}|[a-hj-km-np-z2-9]{8})/?$" {
        if ($link_preview_bot) {
            rewrite ^ /invite.html last;
        }
        return 302 "https://apps.apple.com/app/apple-store/id6773470079?pt=119286625&ct=Challenge%20Invite&mt=8";
    }

    # Root
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404 — squawk 7600 (lost comms)
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
