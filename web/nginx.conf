# Link-preview crawlers (chat apps and social sites that fetch a pasted link
# themselves and render its Open Graph tags). Matched case-insensitively
# anywhere in the User-Agent. Only /c/CODE looks at this — see below.
# Search crawlers (Googlebot) are deliberately absent: invite links are not
# meant to be indexed, and they keep the plain 302 like everyone else.
map $http_user_agent $is_preview_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|WhatsApp|Slackbot|Slack-ImgProxy|Twitterbot|Discordbot|TelegramBot|LinkedInBot|SkypeUriPreview|Pinterest|redditbot)" 1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript text/plain;
    gzip_min_length 256;

    # CSS/JS have stable filenames and change on deploy — revalidate every time
    # (ETag → 304 when unchanged) so updates land immediately, never stale.
    # ("immutable" is only safe for content-hashed names, which we don't use.)
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Images & fonts — short cache, not "immutable" (filenames are stable too).
    location ~* \.(ico|png|jpg|jpeg|svg|woff2?)$ {
        expires 1d;
    }

    # HTML pages — revalidate each time
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Universal links (challenge invites) ---------------------------------
    #
    # iOS fetches this file (through Apple's CDN) and uses it to decide
    # that https://tailspot.app/c/CODE belongs to the app. It must be
    # served over https from this exact path, with NO redirect (not even
    # www -> apex), as JSON, unsigned. The file has no extension, so
    # nginx would otherwise label it application/octet-stream.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # An invite link opened where the app can't take it — desktop,
    # Android, an iPhone without Tailspot — lands here and goes straight
    # to the App Store. No landing page. When the app IS installed iOS
    # opens it directly and this server never sees the request.
    # The code alphabet exactly: 6 characters (8 for codes issued before
    # 2026-09-26, which stay valid) from A-Z minus I, L and O,
    # plus 2-9 (InviteCode.alphabet — 0, 1, I, L and O are excluded because
    # they're ambiguous in print). Anything else under /c/ falls through to
    # `location /` and its 404, which is what the docs promise: a code that
    # could never exist gets the 404, not a pointless App Store trip.
    # Quoted: nginx reads an unquoted `{6}` / `{8}` as a config block and refuses
    # to start ("unknown directive"). Keep the quotes.
    #
    # Link-preview crawlers are the one exception: WhatsApp, Slack, Discord
    # etc. would follow the 302 and show the generic App Store page, so
    # for them (by User-Agent, $is_preview_bot above) the request is handed
    # to an internal location that proxies the API's Open Graph card for
    # the code (GET /v1/invites/CODE/card, see backend/README.md). The card
    # carries a meta refresh to the same App Store URL, so it is still not
    # a landing page. `if` + `rewrite ... last` is one of the constructs
    # that is safe inside a location; keep any other logic out of the `if`.
    location ~* "^/c/([a-hj-km-np-z2-9]{6}|[a-hj-km-np-z2-9]{8})/?$" {
        if ($is_preview_bot) {
            rewrite "^/c/([^/]+)/?$" /_invite-card/$1 last;
        }
        return 302 "https://apps.apple.com/app/apple-store/id6773470079?pt=119286625&ct=Challenge%20Invite&mt=8";
    }

    # Crawler-only: reachable only through the rewrite above (`internal`).
    # The API normalises the code's case, answers unknown codes with the
    # same App Store 302, and sets Cache-Control itself.
    # proxy_pass has no variables, so nginx resolves api.tailspot.app once
    # at startup (no `resolver` needed) — the API's Fly IPs are static.
    # The API meters this per client IP, and every crawler arrives from
    # this app's egress IP, so they share one (generous) bucket there.
    location /_invite-card/ {
        internal;
        rewrite "^/_invite-card/([^/]+)$" /v1/invites/$1/card break;
        proxy_pass https://api.tailspot.app;
        proxy_set_header Host api.tailspot.app;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        # API down, slow, rate limited at the edge, or not yet serving /card
        # (404 — www deployed before the API) → the crawler gets the plain
        # App Store redirect, i.e. exactly the preview it got before.
        proxy_intercept_errors on;
        error_page 404 429 500 502 503 504 = @invite_app_store;
    }

    location @invite_app_store {
        return 302 "https://apps.apple.com/app/apple-store/id6773470079?pt=119286625&ct=Challenge%20Invite&mt=8";
    }

    # Root
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404 — squawk 7600 (lost comms)
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
