# Security headers, included at server level AND in every location that sets
# its own add_header. nginx only inherits server-level add_header into a
# location that has none of its own, so without the per-location includes the
# homepage, invite page and CSS/JS went out with no security headers at all.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No includeSubDomains: that would commit every *.tailspot.app host to HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
