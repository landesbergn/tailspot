<body>

<nav class="site-nav">
  <a class="wordmark" href="/">Tailspot</a>
  <ul class="nav-links">

      <a class="badge-link badge-link--nav" href="https://apps.apple.com/app/apple-store/id6773470079?pt=119286625&amp;ct=Tailspot%20Website&amp;mt=8">
        <img class="app-store-badge" src="app-store-badge.svg"
             alt="Download Tailspot on the App Store">
      </a>
    </li>
  </ul>
</nav>

<!-- ───────────────── Hero ───────────────── -->
<header class="hero">
  <div class="hero-inner">
    <div class="hero-copy">
      <h1 class="hero-title">Catch the planes flying overhead.</h1>
      <div class="cta-row">
        <!-- Apple's badge artwork, used verbatim (app-store-badge.svg is
             Apple's black.svg byte-for-byte — the PREFERRED variant; white is
             only sanctioned when black "appears visually heavy", and on
             #0A0E1A the opposite is true: white renders as a glaring block,
             black as a subtle outlined pill. Verified by rendering both).
             Clear space >= 1/4 its height (12px at 48px tall) comes from the
             title's 1.25rem margin above and the row's 1rem margin below.

             DEPARTURE, at Noah's request (2026-08-14): the badge also appears
             in the nav, and both instances lift/press on hover, where Apple's
             guidelines ask for one badge per page layout and no animation.
             The artwork itself is never altered — the motion is a uniform
             transform on the link wrapper, so proportions are preserved.
             https://developer.apple.com/app-store/marketing/guidelines/#section-badges -->
        <a class="badge-link" href="https://apps.apple.com/app/apple-store/id6773470079?pt=119286625&amp;ct=Tailspot%20Website&amp;mt=8">
          <img class="app-store-badge" src="app-store-badge.svg"
               alt="Download Tailspot on the App Store">
        </a>
      </div>
    </div>

    <!-- Real catches, cross-fading. These are Noah's own photographs, straight
         out of the app: the cyan lock-on brackets are baked into every catch
         JPEG by CatchPhotoComposer at capture time, so the framing is what he
         saw through the viewfinder. Every callsign, airframe and route below
         is what the app actually recorded for that photo — nothing here is a
         mockup, which is the whole point of the product. -->
    <div class="hero-visual">
      <figure class="catch">
        <div class="catch-frame">
          <img class="catch-photo is-active" src="img/catch-b737.jpg" alt="A Boeing 737 overhead, framed by the app's lock-on brackets" width="900" height="567" fetchpriority="high" decoding="async">
          <img class="catch-photo" src="img/catch-b767.jpg" alt="A Boeing 767 against a dark cloud band" width="900" height="567" decoding="async">
          <img class="catch-photo" src="img/catch-a321.jpg" alt="An Airbus A321neo on approach" width="900" height="567" decoding="async">
          <img class="catch-photo" src="img/catch-a220.jpg" alt="An Airbus A220 below breaking cloud" width="900" height="567" decoding="async">
          <img class="catch-photo" src="img/catch-bd700.jpg" alt="A business jet's contrail at 43,000 feet" width="900" height="567" decoding="async">
        </div>
        <figcaption class="catch-meta">
          <span class="catch-headline">
            <span class="catch-tier">● COMMON</span>
            <span class="catch-model">Boeing 737-800</span>
          </span>
          <span class="catch-detail">Southwest · 4,075 ft · 2.1 km</span>
        </figcaption>
      </figure>
    </div>
  </div>
</header>

<!-- No sections below the hero, on purpose: the page is sized to one
     viewport (nav + hero + footer, no scroll), so the "How it works" steps
     and the closing "Get Tailspot" CTA were removed rather than shrunk. The
     hero's headline and the real catch photos carry the pitch; the badge is
     the only call to action, and it appears twice above the fold. -->

<footer class="site-footer">
  <div class="footer-brand-group">
    <span class="footer-brand">Tailspot</span>
    <span class="footer-coords" title="Field-tested under the SFO/OAK approach">37.87° N · 122.27° W</span>
  </div>
  <ul class="footer-links">
    <li><a href="https://apps.apple.com/app/apple-store/id6773470079?pt=119286625&amp;ct=Tailspot%20Website&amp;mt=8">App Store</a></li>
    <li><a href="support.html">Support</a></li>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="terms.html">Terms of Service</a></li>
    <li><a href="attributions.html">Attributions</a></li>
  </ul>
</footer>

<script>
  // The hero cycles Noah's real catches. Each entry is the ADS-B the app
  // recorded for the photo it belongs to — swapping in invented flights here
  // would undercut the one claim the product makes.
  (function () {
    var feed = [
      { tier: 'COMMON',   model: 'Boeing 737-800',  detail: 'Southwest · 4,075 ft · 2.1 km' },
      { tier: 'COMMON',   model: 'Boeing 767-300',  detail: 'Delta · SFO → JFK' },
      { tier: 'COMMON',   model: 'Airbus A321neo',  detail: 'JetBlue · GYE → JFK' },
      { tier: 'UNCOMMON', model: 'Airbus A220-300', detail: 'Air Canada · YVR → SFO' },
      { tier: 'RARE',     model: 'BD-700 Global',   detail: 'Worldwide Jet · 43,225 ft' }
    ];
    var photos = document.querySelectorAll('.catch-photo');
    var meta   = document.querySelector('.catch-meta');
    var tierEl = document.querySelector('.catch-tier');
    var modelEl= document.querySelector('.catch-model');
    var detEl  = document.querySelector('.catch-detail');
    if (!photos.length || !meta || !modelEl) return;

    // No Reduce Motion special-case any more. It first stopped the rotation
    // dead (four of five catches never seen), then cut the fade to a hard cut
    // — which is why the phone snapped between photos while desktop faded.
    // A slow opacity fade between two still photographs is not the movement
    // Reduce Motion exists to suppress; the stylesheet keeps it deliberately.

    // Read the fade lengths from CSS rather than restating them. They used to
    // be duplicated here, and a mismatch means the layer cleanup fires at the
    // wrong moment — the old photo drops out mid-fade and the card flickers.
    var rootStyle = getComputedStyle(document.documentElement);
    function ms(name, fallback) {
      var v = parseFloat(rootStyle.getPropertyValue(name));
      return isNaN(v) ? fallback : v;
    }
    var PHOTO_MS = ms('--catch-fade', 450);
    var META_MS  = ms('--catch-meta-fade', 200);
    var HOLD_MS  = 3600;  // time on screen per catch

    function render(e) {
      tierEl.textContent = '● ' + e.tier;
      tierEl.className = 'catch-tier tier-' + e.tier.toLowerCase();
      modelEl.textContent = e.model;
      detEl.textContent = e.detail;
    }

    // Decode every photo up front. Without this the browser decodes each JPEG
    // the first time it becomes visible — i.e. in the middle of its own fade —
    // and drops frames doing it. They are ~35 KB each and all needed within
    // seconds, so there is nothing to save by deferring.
    var all = Array.prototype.slice.call(photos);
    function warm() {
      all.forEach(function (p) { if (p.decode) p.decode().catch(function () {}); });
    }
    if (document.readyState === 'complete') warm();
    else window.addEventListener('load', warm);

    var i = 0;          // markup already shows feed[0]
    var busy = false;

    function advance() {
      // A backgrounded tab throttles timers, then fires the backlog at once on
      // return — a burst of overlapping fades. Skip instead.
      if (busy || document.hidden) return;
      var next = (i + 1) % photos.length;
      var cur = photos[i], nxt = photos[next];
      busy = true;

      var run = function () {
        nxt.classList.add('is-incoming');
        void nxt.offsetWidth;            // flush, so the class change animates
        nxt.classList.add('is-active');

        meta.style.opacity = '0';
        setTimeout(function () {
          render(feed[next]);
          meta.style.opacity = '1';
        }, META_MS);

        setTimeout(function () {
          cur.classList.remove('is-active');   // hidden beneath nxt; invisible
          nxt.classList.remove('is-incoming'); // drops will-change
          i = next;
          busy = false;
        }, PHOTO_MS);
      };

      // Decode before starting, so a cold image cannot stall its own fade.
      if (nxt.decode) nxt.decode().then(run, run);
      else run();
    }

    setInterval(advance, HOLD_MS);
  })();
</script>

</body>
</html>
