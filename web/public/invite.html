<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The page behind a challenge invite (tailspot.app/c/CODE) wherever the
       plain 302 to the App Store doesn't work. nginx serves it to two
       audiences: link-preview fetchers (iMessage, WhatsApp, Slack...), which
       read only the Open Graph tags, and people inside an app's built-in
       browser (Instagram, Facebook, TikTok...), who see the body. Everyone
       else gets the 302. See "Challenge invite links" in web/README.md.

       The URL is /c/CODE, not /invite.html, so every asset path here is
       absolute. -->
  <title>Join my Tailspot challenge</title>
  <meta name="description" content="A plane-spotting race. Catch the most planes before time runs out.">
  <meta name="robots" content="noindex">
  <meta name="apple-itunes-app" content="app-id=6773470079">
  <meta name="theme-color" content="#0A0E1A">

  <meta property="og:title" content="Join my Tailspot challenge">
  <meta property="og:description" content="A plane-spotting race. Catch the most planes before time runs out.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tailspot">
  <meta property="og:image" content="https://tailspot.app/img/invite-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tailspot challenge invite: you’re invited to a plane-spotting race.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Join my Tailspot challenge">
  <meta name="twitter:description" content="A plane-spotting race. Catch the most planes before time runs out.">
  <meta name="twitter:image" content="https://tailspot.app/img/invite-preview.jpg">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script src="/analytics.js" defer></script>
</head>
<body class="invite-body">

<nav class="site-nav">
  <a class="wordmark" href="/"><img class="wordmark-icon" src="/img/app-icon.png" alt="" width="28" height="28">Tailspot</a>
</nav>

<main class="invite-page">
  <span class="invite-label">Challenge invite</span>
  <!-- The challenge's own name replaces this once the preview loads. -->
  <h1 class="invite-title" id="invite-title">Join my Tailspot challenge</h1>
  <p class="invite-meta" id="invite-meta" hidden></p>

  <!-- Set by the script: the challenge has ended or is full, or the app
       didn't open from the button below. -->
  <p class="invite-note" id="invite-note" hidden></p>

  <a class="btn btn-primary btn-lg invite-open" id="invite-open" href="#" hidden>Open in Tailspot</a>

  <div class="invite-code-block" id="invite-code-block" hidden>
    <span class="invite-code-label">Or join with code</span>
    <div class="invite-code-row">
      <span class="invite-code" id="invite-code"></span>
      <button class="btn btn-ghost" id="invite-copy" type="button">Copy</button>
    </div>
  </div>

  <a class="btn btn-ghost btn-lg invite-store" id="invite-store" href="https://apps.apple.com/app/apple-store/id6773470079?pt=119286625&amp;ct=Challenge%20Invite&amp;mt=8">Get Tailspot</a>

  <a class="invite-safari" id="invite-safari" href="x-safari-https://apps.apple.com/app/apple-store/id6773470079?pt=119286625&amp;ct=Challenge%20Invite&amp;mt=8" hidden>App Store not opening? Try Safari</a>
</main>

<script>
// Why this page exists: a tap on tailspot.app/c/CODE inside Instagram (or any
// app's built-in browser) never reaches iOS, so the universal link can't open
// Tailspot, and the browser then drops the 302 to the App Store on the floor.
// The person saw nothing happen.
//
// What works in there is a link the person taps themselves that leads to a
// DIFFERENT host. tailspot.app and www.tailspot.app are both associated with
// the app (Tailspot.entitlements) and InviteCode.parse accepts either, so the
// "Open in Tailspot" button points at whichever host this page is NOT on.
// A same-host link would never be offered to the app.
(function () {
  var match = location.pathname.match(/^\/c\/([A-Za-z2-9]{6}|[A-Za-z2-9]{8})\/?$/);
  if (!match) return;               // opened as /invite.html: App Store link only
  var code = match[1].toUpperCase();

  var title = document.getElementById('invite-title');
  var meta = document.getElementById('invite-meta');
  var note = document.getElementById('invite-note');
  var open = document.getElementById('invite-open');
  var block = document.getElementById('invite-code-block');
  var codeEl = document.getElementById('invite-code');
  var copy = document.getElementById('invite-copy');
  var safari = document.getElementById('invite-safari');

  function showNote(text) { note.textContent = text; note.hidden = false; }

  codeEl.textContent = code;
  block.hidden = false;

  // "#tried" marks the hop: if the app didn't take the tap, the browser loads
  // this same page from the other host, and the fragment says so. Fragments
  // never reach the server and InviteCode.parse reads only host and path.
  if (location.hash === '#tried') {
    showNote("Tailspot didn't open from here.");
  } else {
    var otherHost = location.hostname === 'www.tailspot.app' ? 'tailspot.app' : 'www.tailspot.app';
    open.href = 'https://' + otherHost + '/c/' + code + '#tried';
    open.hidden = false;
  }

  // x-safari-https:// hands a URL to Safari on iOS 17+. Safari can open the
  // App Store; some in-app browsers refuse to.
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) safari.hidden = false;

  // The challenge's name and state. GET /v1/invites/:code/preview needs no
  // auth but answers only allowlisted Origins (tailspot.app, www and the
  // preview app; backend statsOriginsFromEnv). Any failure keeps the generic
  // title: the code and buttons work without it.
  function untilText(iso) {
    var mins = Math.round((new Date(iso).getTime() - Date.now()) / 60000);
    if (!(mins > 0)) return null;
    if (mins < 60) return mins + 'm';
    var hours = Math.round(mins / 60);
    if (hours < 48) return hours + 'h';
    return Math.round(hours / 24) + 'd';
  }
  fetch('https://api.tailspot.app/v1/invites/' + code + '/preview')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (p) {
      if (!p || !p.name) return;
      title.textContent = p.name;
      document.title = p.name + ' · Tailspot';
      if (p.status === 'cancelled' || p.status === 'finished') {
        showNote(p.status === 'cancelled' ? 'This challenge was cancelled.' : 'This challenge has ended.');
        open.hidden = true;
        block.hidden = true;
        document.getElementById('invite-store').style.marginTop = '1.25rem';
        return;
      }
      var parts = [];
      if (p.creatorHandle) parts.push('From @' + p.creatorHandle);
      if (p.participantCount != null && p.maxParticipants) parts.push(p.participantCount + ' of ' + p.maxParticipants + ' in');
      var when = p.status === 'upcoming' ? untilText(p.startsAt) : untilText(p.endsAt);
      if (when) parts.push((p.status === 'upcoming' ? 'Starts in ' : 'Ends in ') + when);
      if (parts.length) { meta.textContent = parts.join(' · '); meta.hidden = false; }
      if (p.participantCount >= p.maxParticipants) showNote('This challenge is full.');
    })
    .catch(function () { /* keep the generic title */ });

  copy.addEventListener('click', function () {
    function done() {
      copy.textContent = 'Copied';
      setTimeout(function () { copy.textContent = 'Copy'; }, 2000);
    }
    function fallback() {
      // In-app browsers often block the async clipboard API.
      var range = document.createRange();
      range.selectNodeContents(codeEl);
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      try { if (document.execCommand('copy')) done(); } catch (e) { /* leave it selected */ }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, fallback);
    } else {
      fallback();
    }
  });
})();
</script>

</body>
</html>
