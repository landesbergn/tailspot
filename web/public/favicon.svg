<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The iOS app icon (AppIcon icon-light, 128px), clipped to a rounded square
       so the tab icon matches the home-screen shape. Regenerate from
       ios/Tailspot/Tailspot/Assets.xcassets/AppIcon.appiconset/ if the icon changes. -->
  <clipPath id="r"><rect width="128" height="128" rx="28"/></clipPath>
  <image width="128" height="128" clip-path="url(#r)" href="data:image/png;base64,"/>
</svg>
