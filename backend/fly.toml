# fly.toml — Tailspot API on Fly.io
# Primary region: sjc (San Jose, CA) — close to SFO/OAK field-test area.
# Deploy with: fly deploy (from this directory)
# Manage with: fly dashboard  https://fly.io/apps/tailspot-api

app = "tailspot-api"
primary_region = "sjc"

[build]
  # Uses the multi-stage Dockerfile in this directory.

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm: the iOS app's only ADS-B source is this
  # backend, so a scale-to-zero cold start surfaced as a failed first fetch
  # ("Request timed out" for testers). One always-on shared-cpu machine
  # (~$2/mo) removes that cold-start path. The second machine still
  # auto-stops/starts for scale.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Load shedding at the edge. Fly's default is `type = "connections"` with a
  # soft limit of 20 and NO hard limit — which is wrong for us twice over.
  # First, connections is the wrong unit for a Node API: iOS clients hold
  # keep-alive sockets open between 10-second polls, so a machine can sit at 20
  # "connections" while doing essentially nothing, and the proxy starts spilling
  # to (or cold-starting) the second machine for no reason. Requests measures
  # the work actually in flight. Second, with no hard limit the proxy will keep
  # queueing onto a machine that is already saturated, so a burst turns into an
  # OOM on a 256 MB VM instead of a fast 503.
  #
  # 100 soft / 200 hard: a single Node process on one shared vCPU handles these
  # handlers (cache reads, one-row DB lookups) in tens of ms, so 100 concurrent
  # requests is already far past normal — steady state with a few hundred users
  # polling every 10 s is a couple of requests per second. Soft 100 spreads load
  # to the second machine before latency shows; hard 200 refuses the rest rather
  # than accepting work it cannot finish.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
