<!doctype html>
<meta charset="utf-8">
<title>Tailspot creative 1.2.5</title>
<!-- Header (21:9), search results (3:2) and universal (16:9) creative for the 1.2.5 listing: a hand of five
     real catches fanned from the bottom, the Legendary E-6 in the middle. Open creative.html#header|#search|#universal
     and screenshot at half size with --force-device-scale-factor=2 (see the folder README). -->
<style>
:root{--cyan:#00D4FF;--navy:#0B1428;--card:#11151F;--t2:#A0B0C0;
  --sf:-apple-system,"SF Pro Display",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
.stage{position:relative;overflow:hidden;font-family:var(--sf);color:#fff}
.hd{position:absolute;font-weight:800;letter-spacing:-.02em;line-height:1.02}
.hd em{font-style:normal;display:block}
/* Card, same build as creative.html but sized by its own width in px. */
.card{position:absolute;border-radius:28px;background:var(--card);overflow:hidden;border:3px solid rgba(0,212,255,.6);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.card .ph{position:relative;aspect-ratio:6/5;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph svg{position:absolute;left:20%;top:14%;width:60%;height:72%;overflow:visible}
.card .meta{padding:.07em .08em .08em;display:flex;flex-direction:column;gap:.03em;font-family:var(--mono)}
.card .ty{font-weight:700;font-size:.095em;letter-spacing:.04em;white-space:nowrap}
.card .op{font-size:.05em;letter-spacing:.12em}
.card .earn{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #262C3A;padding-top:.04em;margin-top:.02em}
.card .earn small{font-size:.046em;letter-spacing:.12em;color:var(--t2)}
.card .earn strong{font-size:.1em}
.card .stats>div{display:flex;flex-direction:column}
.card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.02em;border-top:2px solid #262C3A;padding-top:.04em;margin-top:.02em}
.card .stats small{display:block;font-size:.04em;color:var(--t2);letter-spacing:.1em}
.card .stats strong{font-size:.07em;white-space:nowrap}
.card .stats strong span{font-size:.6em;color:var(--t2)}
</style>
<div id="o"></div>
<script>
const arm='M8 26 V8 H26 M74 8 H92 V26 M8 74 V92 H26 M74 92 H92 V74';
const ret=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${arm}" fill="none" stroke="#04070D" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><path d="${arm}" fill="none" stroke="#00D4FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
// Real catch rows. Tier tints and points from GameSystem.swift.
const E6 ={img:'e6.png',ty:'E-6 MERCURY',op:'US NAVY · LEGENDARY',tint:'#FFC74A',alt:'1,801',spd:'135',dist:'1.3',pts:500};
const C27={img:'ph/c27j_card.jpg',ty:'C-27J SPARTAN',op:'US COAST GUARD · EPIC',tint:'#AB78EA',alt:'427',spd:'132',dist:'1.9',pts:100};
const L39={img:'l39.png',ty:'L-39 ALBATROS',op:'PATRIOTS JET TEAM · RARE',tint:'#00D4FF',alt:'200',spd:'252',dist:'0.8',pts:50};
const BD7={img:'ph/bd700_card.jpg',ty:'GLOBAL EXPRESS',op:'WORLDWIDE JET · RARE',tint:'#00D4FF',alt:'43,225',spd:'546',dist:'27.1',pts:50};
const A321={img:'ph/a321_guess.jpg',ty:'A321NEO',op:'JETBLUE · COMMON',tint:'#8595A5',alt:'',spd:'',dist:'',pts:10};
const card=(c,{x,y,w,rot=0,border,glow,stats=true,origin='50% 50%'})=>`<div class="card" style="left:${x}px;top:${y}px;width:${w}px;font-size:${w}px;transform:rotate(${rot}deg);transform-origin:${origin};${border?`border-color:${border};`:''}${glow?`box-shadow:${glow};`:''}">
  <div class="ph"><img src="${c.img}" alt="">${ret}</div>
  <div class="meta"><div class="ty">${c.ty}</div><div class="op" style="color:${c.tint}">${c.op}</div>
  ${stats&&c.alt?`<div class="stats"><div><small>ALT</small><strong>${c.alt}<span> ft</span></strong></div><div><small>SPD</small><strong>${c.spd}<span> kt</span></strong></div><div><small>DIST</small><strong>${c.dist}<span> km</span></strong></div></div>`:''}
  <div class="earn"><small>CAUGHT</small><strong style="color:${c.tint}">+${c.pts}</strong></div></div></div>`;

// A fan of cards: the four side cards at +/-step and +/-2*step around a shared pivot below the
// frame, the E-6 a little bigger and higher in front. cx is the fan's centre line.
const fan=({cx,y,w,step,pivot='50% 260%'})=>
  [[A321,-2],[L39,-1],[C27,1],[BD7,2]].map(([c,i])=>card(c,{x:cx-w/2,y,w,rot:i*step,stats:false,origin:pivot,border:c.tint})).join('')+
  card(E6,{x:cx-w*0.55,y:y-w*0.08,w:w*1.1,stats:false,origin:pivot,border:'#FFC74A',glow:'0 0 0 4px rgba(255,199,74,.18),0 0 60px rgba(255,199,74,.28),0 30px 70px rgba(0,0,0,.6)'});
const bg='radial-gradient(60% 60% at 50% 100%,#3B2A6A 0%,transparent 70%),radial-gradient(60% 45% at 50% -10%,#173B55 0%,transparent 70%),linear-gradient(180deg,#0A1330,#17204A)';
const hl=(size,css)=>`<div class="hd" style="${css};font-size:${size}px;text-shadow:0 0 .4em rgba(0,0,0,.3)">`;
// Layouts in CSS px at half the output size. The header keeps everything inside the 16:9
// centre crop App Store Connect shows on iPhone (x 228..1692 of 1920).
const L={
 search:{w:1920,h:1280,html:()=>hl(118,'left:0;right:0;top:56px;text-align:center')+`What's that plane? <em style="display:inline;color:var(--cyan)">Catch it.</em></div>`+fan({cx:960,y:300,w:510,step:15})},
 universal:{w:2622,h:1475,html:()=>hl(150,'left:0;right:0;top:70px;text-align:center')+`What's that plane? <em style="display:inline;color:var(--cyan)">Catch it.</em></div>`+fan({cx:1311,y:350,w:620,step:15})},
 header:{w:1920,h:823,html:()=>hl(78,'left:268px;top:312px')+`Catch the planes<em style="color:var(--cyan)">overhead.</em></div>`+fan({cx:1296,y:170,w:290,step:7})},
};
const l=L[location.hash.slice(1)||'search'];
document.getElementById('o').innerHTML=`<div class="stage" style="width:${l.w}px;height:${l.h}px;background:${bg}">${l.html()}</div>`;
</script>
