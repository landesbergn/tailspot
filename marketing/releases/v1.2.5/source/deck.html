<!doctype html>
<meta charset="utf-8">
<title>Tailspot store slides 1.2.5</title>
<!-- One renderer for all seven 1.2.5 App Store slides (1206 x 2622, the size App Store Connect accepts for this slot).
     Open deck.html#1 … #7; headless Chrome screenshots each at 1206x2622.
     Type is the Mac system fonts (SF Pro / SF Mono), so render on a Mac. -->
<style>
:root{--cyan:#00D4FF;--app-text:#E8F4FF;--app-text-2:#A0B0C0;--card:#11151F;
  --sf:-apple-system,"SF Pro Display",system-ui,sans-serif;--sfmono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0B1428;width:1206px;height:2622px;overflow:hidden}
.slide{position:relative;width:1206px;aspect-ratio:1206/2622;container-type:inline-size;overflow:hidden;
  background:radial-gradient(90% 40% at 15% 0%,#173B55 0%,transparent 70%),linear-gradient(180deg,#0B1428 0%,#141C33 55%,#2B2236 100%);color:#fff;font-family:var(--sf)}
/* Headline: same size, weight and place on every slide; the second half in cyan. */
.hl{position:absolute;left:7cqw;right:7cqw;top:9cqw;font-weight:800;letter-spacing:-.02em;line-height:1.02;text-align:center;font-size:11.5cqw;text-wrap:balance}
.hl em{font-style:normal;color:var(--cyan)}
/* Catch card (slides 1-2) and UI panel (slides 3-7) share the top line, border and shadow. */
.idcard{position:absolute;top:56cqw;border:.4cqw solid rgba(0,212,255,.35);box-shadow:0 3cqw 8cqw rgba(0,0,0,.4)}
.idcard{left:7cqw;right:7cqw;border-radius:5cqw;background:var(--card);overflow:hidden}
.idcard .ph{position:relative;aspect-ratio:6/5;overflow:hidden}
.idcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.idcard .ph .ret{position:absolute;left:20%;top:14%;width:60%;height:72%;overflow:visible}
.idcard .meta{padding:5.5cqw 6cqw 6cqw;display:flex;flex-direction:column;gap:2.4cqw}
.idcard .ty{font-family:var(--sfmono);font-weight:700;font-size:7.2cqw;letter-spacing:.04em;white-space:nowrap}
.idcard .op{font-family:var(--sfmono);font-size:4cqw;letter-spacing:.12em}
.idcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:2.4cqw;border-top:.3cqw solid #262C3A;padding-top:4cqw;padding-bottom:1.2cqw}
.idcard .stats div{display:flex;flex-direction:column;gap:1cqw}
.idcard .stats small{font-family:var(--sfmono);font-size:3.2cqw;color:var(--app-text-2);letter-spacing:.1em}
.idcard .stats strong{font-family:var(--sfmono);font-size:5.6cqw;white-space:nowrap;font-variant-numeric:tabular-nums}
.idcard .stats strong span{font-size:3.4cqw;color:var(--app-text-2)}
.idcard .earn{display:flex;justify-content:space-between;align-items:baseline;border-top:.3cqw solid #262C3A;padding-top:4cqw;margin-top:1cqw;font-family:var(--sfmono)}
.idcard .earn small{font-size:3.6cqw;letter-spacing:.12em;color:var(--app-text-2)}
.idcard .earn strong{font-size:8cqw}
/* Slides 3-7: illustrated, centred compositions built from the app's own parts. */
.mono{font-family:var(--sfmono)}
.col{position:absolute;left:7cqw;right:7cqw;display:flex;flex-direction:column;align-items:center}
.box{background:var(--card);border:.4cqw solid rgba(0,212,255,.35);box-shadow:0 3cqw 8cqw rgba(0,0,0,.4);border-radius:5cqw;overflow:hidden;width:100%}
/* 3: guess round, drawn like the in-card round in CatchRevealView */
.g{padding:4cqw 4cqw 6cqw}
.g .ph{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:4cqw;border:.3cqw solid rgba(255,255,255,.12)}
.g .ph img{width:100%;height:100%;object-fit:cover;display:block}
.g .ph .ret{position:absolute;left:28%;top:15%;width:46%;height:70%;overflow:visible}
.g .meta{padding:5cqw 2cqw 0;display:flex;flex-direction:column;gap:2cqw}
.g .ty{font-family:var(--sfmono);font-weight:700;font-size:7.4cqw;letter-spacing:.1em}
.g .op{font-family:var(--sfmono);font-size:3.9cqw;letter-spacing:.1em;display:flex;align-items:center;gap:2cqw}
.g .op i{width:2.4cqw;height:2.4cqw;border-radius:50%;background:#8595A5}
.g hr{border:0;border-top:.3cqw solid #262C3A;margin:2.4cqw 0 1.6cqw;width:100%}
.g .bonus{font-family:var(--sfmono);font-weight:700;font-size:3.8cqw;letter-spacing:.12em;color:#FFC74A}
.g .q{font-family:var(--sfmono);font-weight:700;font-size:5.5cqw;color:var(--cyan);white-space:nowrap;letter-spacing:-.01em}
.g .chips{display:flex;flex-direction:column;gap:2.4cqw;margin-top:2.4cqw}
.g .chip{display:flex;justify-content:space-between;align-items:center;font-family:var(--sfmono);font-weight:600;font-size:4.8cqw;
  padding:3cqw 4.6cqw;border-radius:3.6cqw;background:rgba(26,32,48,.5);border:.3cqw solid rgba(0,212,255,.06);color:#7F8B98}
.g .chip.ok{background:rgba(61,214,140,.15);border-color:#3DD68C;color:#E8F4FF}
.g .chip.ok b{color:#3DD68C;font-size:5cqw}
/* 4: Hangar Sets tab, drawn like SetsScreen (segmented control + SetCompletionCard rows) */
.seg{display:flex;width:100%;padding:1.2cqw;border-radius:10cqw;background:#11151F;border:.3cqw solid #262C3A}
.seg span{flex:1;text-align:center;font-size:5cqw;padding:3cqw 0;border-radius:10cqw;color:#A0B0C0;font-weight:500}
.seg span.on{background:#00B8DE;color:#04121A;font-weight:600;box-shadow:0 0 5cqw rgba(0,212,255,.35)}
.sets{display:flex;flex-direction:column;gap:3cqw;width:100%}
.setc{display:flex;align-items:center;gap:5cqw;padding:4.2cqw 5cqw 4.2cqw 4.2cqw;border-radius:4.4cqw;background:#1A2030;border:.3cqw solid rgba(232,244,255,.06)}
.setc svg.ring{width:16cqw;height:16cqw;flex:none}
.setc .tx{flex:1;display:flex;flex-direction:column;gap:1.4cqw}
.setc b{font-size:6.6cqw;font-weight:600}
.setc small{font-family:var(--sfmono);font-weight:600;font-size:4cqw;color:#7F8B98}
.setc .chev{color:rgba(127,139,152,.6);font-size:5cqw;font-weight:600}
/* 5: trophies */
.hex{position:relative;clip-path:polygon(50% 0%,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%)}
.medal{position:relative}
.medal .o{position:absolute;inset:0}
.medal .in{position:absolute;inset:10%}
.medal svg{position:absolute;left:24%;top:24%;width:52%;height:52%}
.burst{position:absolute;left:50%;top:50%;width:170%;height:170%;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(255,199,74,.16) 0deg 8deg,transparent 8deg 30deg);
  -webkit-mask-image:radial-gradient(circle,#000 25%,transparent 68%);mask-image:radial-gradient(circle,#000 25%,transparent 68%)}
.halo{position:absolute;left:50%;top:50%;width:150%;height:150%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,199,74,.32),transparent 62%)}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:4cqw 3cqw;width:100%}
.shelf div{display:flex;flex-direction:column;align-items:center;gap:2cqw}
.shelf span{font-size:3.4cqw;color:var(--app-text-2);text-align:center;white-space:nowrap}
/* 6: podium */
.pod{display:flex;align-items:flex-end;justify-content:center;gap:3cqw;width:100%}
.pod .p{display:flex;flex-direction:column;align-items:center;gap:2.4cqw;width:26cqw}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1A2232;position:relative}
.av svg{width:56%;height:56%}
.pod .pts{font-family:var(--sfmono);font-weight:700;font-size:4.6cqw}
.pod .blk{width:100%;border-radius:3cqw 3cqw 1cqw 1cqw;display:flex;justify-content:center;padding-top:3cqw;font-size:13cqw;font-weight:800;color:rgba(255,255,255,.92)}
.rows{width:100%;display:flex;flex-direction:column;gap:2.4cqw}
.row{display:flex;align-items:center;gap:3.4cqw;background:var(--card);border:.35cqw solid #222A3A;border-radius:3.4cqw;padding:3cqw 4cqw}
.row .rk{font-family:var(--sfmono);font-weight:700;font-size:4.8cqw;width:5cqw;color:var(--app-text-2)}
.row .bar{flex:1;height:2.4cqw;border-radius:2cqw;background:#2A3242}
.row .pt{font-family:var(--sfmono);font-size:4.4cqw;color:var(--app-text-2)}
.up{font-family:var(--sfmono);font-weight:700;font-size:3.8cqw;color:#4ECCA3;background:rgba(78,204,163,.14);border-radius:2cqw;padding:.8cqw 2cqw}
.pill{font-family:var(--sfmono);font-size:3.6cqw;letter-spacing:.14em;color:var(--app-text-2);display:flex;gap:2cqw;align-items:center}
.pill b{color:#04121A;background:var(--cyan);border-radius:10cqw;padding:1.2cqw 3.4cqw;font-weight:700;letter-spacing:.14em}
/* 7: challenge */
.push{width:100%;border-radius:6cqw;padding:4cqw 4.6cqw;display:flex;gap:3.6cqw;align-items:flex-start;
  background:rgba(48,56,74,.82);border:.3cqw solid rgba(255,255,255,.14);box-shadow:0 4cqw 10cqw rgba(0,0,0,.5);backdrop-filter:blur(20px)}
.push img{width:11cqw;height:11cqw;border-radius:2.6cqw;flex:none}
.push .tx{flex:1;display:flex;flex-direction:column;gap:.8cqw}
.push .hd{display:flex;justify-content:space-between;font-size:3.4cqw;color:#B8C2D2;letter-spacing:.02em}
.push .t{font-size:4.6cqw;font-weight:700}
.push .b{font-size:4.3cqw;color:#E3E8F0;line-height:1.3}
.race{padding:5.5cqw 5.5cqw 7cqw;display:flex;flex-direction:column;gap:4.6cqw}
.race .h{display:flex;justify-content:space-between;align-items:baseline}
.race .h b{font-size:7.4cqw;font-weight:800}
.race .h span{font-family:var(--sfmono);font-size:3.4cqw;color:#FF8A5B;letter-spacing:.1em}
.race .sub{font-family:var(--sfmono);font-size:3.3cqw;color:var(--app-text-2);letter-spacing:.12em;margin-top:-2cqw}
.lane{display:grid;grid-template-columns:5cqw 12cqw 1fr;align-items:center;gap:2.6cqw}
.lane .rk{font-family:var(--sfmono);font-weight:700;font-size:4.6cqw;color:var(--app-text-2)}
.lane .track{position:relative;height:12.5cqw}
.lane .fill{position:absolute;inset:0 auto 0 0;border-radius:2.6cqw;display:flex;align-items:center;justify-content:flex-end;padding-right:3cqw;font-family:var(--sfmono);font-weight:700;font-size:4.2cqw}
.lane.me .fill{box-shadow:0 0 6cqw rgba(0,212,255,.35)}
.lane .you{position:absolute;left:3cqw;top:50%;transform:translateY(-50%);font-family:var(--sfmono);font-weight:700;font-size:3.6cqw;letter-spacing:.14em;color:#04121A}
</style>
<div id="o"></div>
<script>
const arm='M8 26 V8 H26 M74 8 H92 V26 M8 74 V92 H26 M74 92 H92 V74';
const reticle=`<svg class="ret" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <path d="${arm}" fill="none" stroke="#04070D" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${arm}" fill="none" stroke="#00D4FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const card=c=>`<div class="idcard">
  <div class="ph"><img src="${c.img}" alt="">${reticle}</div>
  <div class="meta"><div class="ty">${c.ty}</div><div class="op" style="color:${c.tint}">${c.op}</div>
    <div class="stats"><div><small>ALT</small><strong>${c.alt}<span> ft</span></strong></div><div><small>SPD</small><strong>${c.spd}<span> kt</span></strong></div><div><small>DIST</small><strong>${c.dist}<span> km</span></strong></div></div>
    <div class="earn"><small>CAUGHT</small><strong style="color:${c.tint}">+${c.pts}</strong></div></div></div>`;
// Real catch rows (Fleet Week 2026). Tier tints and points from GameSystem.swift.
const E6 ={img:'e6.png', ty:'E-6 MERCURY',  op:'US NAVY · LEGENDARY',      tint:'#FFC74A',alt:'1,801',spd:'135',dist:'1.3',pts:500};
const L39={img:'l39.png',ty:'L-39 ALBATROS',op:'PATRIOTS JET TEAM · RARE', tint:'#00D4FF',alt:'200',  spd:'252',dist:'0.8',pts:50};
const ICON={
 crown:'<path d="M4 12l3 12h18l3-12-6 5-6-9-6 9-6-5z" fill="C"/><circle cx="4" cy="11" r="2" fill="C"/><circle cx="16" cy="6" r="2" fill="C"/><circle cx="28" cy="11" r="2" fill="C"/><path d="M7 26h18" stroke="C" stroke-width="2" stroke-linecap="round"/>',
 diamond:'<path d="M16 4L6 13l10 15 10-15-10-9z" stroke="C" stroke-width="1.8" stroke-linejoin="round" fill="C" fill-opacity=".18"/><path d="M6 13h20M11 13l5 15M21 13l-5 15M16 4l-5 9M16 4l5 9" stroke="C" stroke-width="1.2"/>',
 night:'<path d="M14 4a12 12 0 100 24 10 10 0 01-3-19c1-1 2-3 3-5z" fill="C"/><circle cx="24" cy="9" r="1" fill="C"/><circle cx="26" cy="14" r="1.2" fill="C"/><circle cx="22" cy="16" r=".8" fill="C"/>',
 constellation:'<g fill="C"><circle cx="16" cy="7" r="2"/><circle cx="8" cy="20" r="2"/><circle cx="24" cy="20" r="2"/></g><path d="M16 9l-6 9M16 9l6 9M10 20h12" stroke="C" stroke-width="1.2" opacity=".6"/>',
 catcher:'<path d="M5 9V5h4M27 9V5h-4M5 23v4h4M27 23v4h-4" stroke="C" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="16" r="3" fill="C"/><circle cx="16" cy="16" r="7" stroke="C" stroke-width="1.4" stroke-dasharray="2 2"/>',
 widebody:'<path d="M16 3c1.2 0 1.8 1.5 2 3l.4 6 8 4.2c.8.4 1.2 1 1.2 1.8v.6c0 .3-.3.5-.6.4l-8.6-2-.3 5 2.4 1.6c.2.2.3.4.3.7v.2c0 .3-.3.5-.6.4l-4.2-1-4.2 1c-.3.1-.6-.1-.6-.4v-.2c0-.3.1-.5.3-.7L13.5 22l-.3-5-8.6 2c-.3.1-.6-.1-.6-.4V18c0-.8.4-1.4 1.2-1.8l8-4.2.4-6c.2-1.5.8-3 2-3z" fill="C"/>',
 star:'<path d="M16 4l3.5 7.6 8.3.9-6.2 5.6 1.8 8.2L16 22.1l-7.4 4.2 1.8-8.2-6.2-5.6 8.3-.9z" fill="C"/>',
 world:'<circle cx="16" cy="16" r="9" stroke="C" stroke-width="2"/><path d="M7 16h18M16 7c3 3 3 15 0 18M16 7c-3 3-3 15 0 18" stroke="C" stroke-width="1.6" opacity=".7"/>',
};
const TIER={gold:['#FFC74A','#9C6E00'],plat:['#A9F4FF','#005A73'],silver:['#C5D0DA','#6C7986'],bronze:['#C26B3F','#7D3F1F']};
const medal=(icon,tier,sz)=>{const [o,i]=TIER[tier];return `<div class="medal" style="width:${sz}cqw;height:${sz}cqw;filter:drop-shadow(0 1.5cqw 4cqw ${o}55)">
 <div class="o hex" style="background:linear-gradient(135deg,${o},${i})"></div>
 <div class="in hex" style="background:radial-gradient(circle at 35% 30%,${i},rgba(0,0,0,.85))"></div>
 <svg viewBox="0 0 32 32" fill="none">${ICON[icon].replaceAll('"C"','"'+o+'"')}</svg></div>`};
const locked=sz=>`<div class="medal" style="width:${sz}cqw;height:${sz}cqw"><div class="o hex" style="background:#3A4256"></div><div class="in hex" style="inset:3%;background:#121722"></div>
 <svg viewBox="0 0 24 24" fill="none" style="left:33%;top:33%;width:34%;height:34%"><rect x="5" y="11" width="14" height="10" rx="2" stroke="#5A6378" stroke-width="1.6"/><path d="M8 11V8a4 4 0 018 0v3" stroke="#5A6378" stroke-width="1.6"/></svg></div>`;
// 3. Guess round: the real JBU1770 catch (photo cropped to inside the bracket the app baked in, one reticle drawn on top as on slides 1-2) (A321neo, GYE→JFK), its real four chips, GYE answered right.
const chip=(code,city,ok)=>`<div class="chip${ok?' ok':''}"><span>${code} · ${city}</span>${ok?'<b>✓</b>':''}</div>`;
const s3=`<div class="col" style="top:56cqw"><div class="box g">
 <div class="ph"><img src="ph/a321_guess.jpg" alt="">${reticle}</div>
 <div class="meta"><div class="ty">A321NEO</div><div class="op"><i></i>JBU1770 · JETBLUE AIRWAYS</div><hr>
  <div class="bonus">BONUS ROUND · +25%</div><div class="q">Where's it coming from?</div>
  <div class="chips">${chip('BOG','Bogota')}${chip('GYE','Guayaquil',1)}${chip('UIO','Quito')}${chip('CCS','Maiquetía')}</div></div></div></div>`;
// 4. Hangar Sets tab. Set sizes are the real family sets in Sets.swift; progress is illustrative.
const ring=(c,t)=>{const f=c/t,r=19,C=2*Math.PI*r;const mid=f>=1?'<path d="M17 25l5 5 10-11" fill="none" stroke="#00D4FF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>'
 :`<text x="25" y="29.5" text-anchor="middle" font-family="ui-monospace,SF Mono,Menlo" font-weight="800" font-size="12.5" fill="#E8F4FF">${Math.round(f*100)}%</text>`;
 return `<svg class="ring" viewBox="0 0 50 50"><circle cx="25" cy="25" r="${r}" fill="none" stroke="rgba(127,139,152,.18)" stroke-width="5"/>
 <circle cx="25" cy="25" r="${r}" fill="none" stroke="#00D4FF" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C*f} ${C}" transform="rotate(-90 25 25)"/>${mid}</svg>`};
const setc=(t,c,n)=>`<div class="setc">${ring(c,n)}<div class="tx"><b>${t}</b><small>${c} of ${n} variants</small></div><span class="chev">›</span></div>`;
const s4=`<div class="col" style="top:56cqw;gap:5cqw">
 <div class="seg"><span class="on">Sets</span><span>Recent</span><span>Trophies</span></div>
 <div class="sets">${setc('Airbus A220',2,2)}${setc('Airbus A320',4,6)}${setc('Boeing 777',2,5)}${setc('Boeing 737',3,8)}${setc('Boeing 787',1,3)}</div>
</div>`;
// 5. Trophy unlock: the real Legendary trophy (crown), then a shelf of real ones.
const s5=`<div class="col" style="top:48cqw;gap:0">
 <div class="mono" style="font-size:3.8cqw;letter-spacing:.5em;color:var(--cyan);margin-bottom:5cqw">NEW TROPHY</div>
 <div style="position:relative;width:52cqw;height:52cqw;display:flex;align-items:center;justify-content:center">
  <div class="burst"></div><div class="halo"></div><div style="position:relative">${medal('crown','gold',52)}</div></div>
 <div style="font-size:9cqw;font-weight:800;margin-top:6cqw">Legendary</div>
 <div style="font-size:4.4cqw;color:var(--app-text-2);margin-top:1.4cqw">Catch a legendary plane</div>
 <div class="shelf" style="margin-top:12cqw">
  <div>${medal('diamond','gold',17)}<span>First Rare</span></div><div>${medal('night','gold',17)}<span>Night Owl</span></div>
  <div>${medal('constellation','plat',17)}<span>Constellation</span></div><div>${medal('star','plat',17)}<span>Brass Hat</span></div>
  <div>${medal('catcher','gold',17)}<span>First Catch</span></div><div>${medal('widebody','gold',17)}<span>Wide Awake</span></div>
  <div>${locked(17)}<span>???</span></div><div>${locked(17)}<span>???</span></div></div></div>`;
// 6. Leaderboard: podium and rows, no handles; one row climbing.
const person=c=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4.2" fill="${c}"/><path d="M3.5 21c.8-4.6 4.2-7 8.5-7s7.7 2.4 8.5 7z" fill="${c}"/></svg>`;
const pod=(rk,pts,h,c,sz,crown='')=>`<div class="p">${crown}<div class="av" style="width:${sz}cqw;height:${sz}cqw;box-shadow:0 0 0 .7cqw ${c}">${person(c)}</div>
 <div class="pts">${pts}</div><div class="blk" style="height:${h}cqw;background:linear-gradient(180deg,${c}cc,${c}33)">${rk}</div></div>`;
const s6=`<div class="col" style="top:56cqw;gap:6cqw">
 <div class="pod">${pod(2,'985',36,'#C5D0DA',17)}${pod(1,'1,240',50,'#FFC74A',21)}${pod(3,'720',26,'#C26B3F',17)}</div>
 <div class="rows">
  <div class="row" style="border-color:rgba(0,212,255,.6);box-shadow:0 0 6cqw rgba(0,212,255,.25)"><span class="rk" style="color:#fff">4</span><div class="av" style="width:9cqw;height:9cqw">${person('#00D4FF')}</div><div class="bar" style="background:linear-gradient(90deg,#00D4FF,#00D4FF55)"></div><span class="up">▲ 3</span><span class="pt" style="color:#fff">615</span></div>
  <div class="row"><span class="rk">5</span><div class="av" style="width:9cqw;height:9cqw">${person('#5A6378')}</div><div class="bar" style="flex:.8"></div><div style="flex:.2"></div><span class="pt">540</span></div>
